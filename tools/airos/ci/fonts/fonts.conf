<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The system's Fontconfig configuration on arm64 images, which have no
	fontconfig package: the one Summit's engine carries. Summit points its
	own configuration at this file; without it only Summit's emoji fonts are
	found and pages show no text. -->
<fontconfig>
	<include ignore_missing="yes">/boot/system/lib/summit-webkit/etc/fonts/fonts.conf</include>
</fontconfig>
