# air/OS release images, built on the self-hosted air/OS build server
# (airos-works/airos-ci) from the pushed commit:
#   x86_64  airos-x86_64.iso   USB stick / CD, EFI and BIOS (X399 and other PCs)
#   arm64   airos-arm64.iso    USB stick, UEFI (ROCK 5 ITX and other arm64 machines)
#   rpi4    airos-rpi4.img     Raspberry Pi 4 SD card (Balena Etcher), boots directly
#   cubie   airos-cubie.img    Radxa Cubie A7S SD card with U-Boot and UEFI
# Each image is smoke-tested (Pi: SD layout) and published on the build server
# and as a public, immutable GitHub prerelease; its packages go into the
# target's System Updater feed (http://192.168.1.200/updates/<target>/,
# docs/airos/SYSTEM-UPDATER.md), which is mirrored to GitHub Releases
# (updates-<target>, update-<target>-<id>): machines update from there. They
# are rebuilt nightly too, to pick up new builds of the applications and
# Summit.
name: air/OS images

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: images to build
        default: x86_64 arm64 rpi4 cubie

permissions:
  contents: write

concurrency:
  group: airos-images
  cancel-in-progress: false

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, arm64, rpi4, cubie]
    runs-on: [self-hosted, airos-build]
    timeout-minutes: 240
    steps:
      - name: Selected
        id: selected
        run: |
          targets="${{ inputs.targets || 'x86_64 arm64 rpi4 cubie' }}"
          [[ " $targets " == *" ${{ matrix.target }} "* ]] && echo "build=1" >> "$GITHUB_OUTPUT" || true

      - name: Fetch airos-ci
        if: steps.selected.outputs.build
        run: |
          rm -rf "$RUNNER_TEMP/airos-ci"
          git clone -q --depth 1 https://github.com/airos-works/airos-ci.git "$RUNNER_TEMP/airos-ci"
          git -C "$RUNNER_TEMP/airos-ci" log --oneline -1

      - name: Build ${{ matrix.target }}
        id: build
        if: steps.selected.outputs.build
        run: '"$RUNNER_TEMP/airos-ci/images/build-image.sh" "${{ matrix.target }}" "$GITHUB_SHA"'

      - name: Smoke test
        if: steps.selected.outputs.build
        run: '"$RUNNER_TEMP/airos-ci/images/smoke-test.sh" "${{ matrix.target }}" "${{ steps.build.outputs.IMAGE_DIR }}"'

      - name: Publish the release to System Updater's feed
        if: steps.selected.outputs.build
        run: 'python3 "$RUNNER_TEMP/airos-ci/images/release-feed.py" publish "${{ matrix.target }}" "${{ steps.build.outputs.IMAGE_DIR }}"'

      - name: Publish verified image to GitHub Releases
        if: steps.selected.outputs.build
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 "$RUNNER_TEMP/airos-ci/images/publish-github.py" "${{ matrix.target }}" "${{ steps.build.outputs.IMAGE_DIR }}"'

      - name: Publish System Updater's feed to GitHub Releases
        if: steps.selected.outputs.build
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'python3 "$RUNNER_TEMP/airos-ci/images/publish-feed-github.py" "${{ matrix.target }}"'

      - name: Summary
        if: always() && steps.build.outputs.IMAGE_DIR
        run: |
          dir="${{ steps.build.outputs.IMAGE_DIR }}"
          url="http://airos-build.local/images/${{ matrix.target }}/$(basename "$dir")/"
          {
            echo "## ${{ matrix.target }}"
            echo "Image: [$url]($url)"
            echo '```'
            cat "$dir/smoke.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
